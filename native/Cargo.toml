[package]
name = "seclogx-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Optional bounded native parsers for seclogx"
exclude = ["tests/**", "target/**"]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py310", "extension-module"] }
arrow-array = { version = "=59.2.0", features = ["ffi"] }
arrow-schema = { version = "=59.2.0", features = ["ffi"] }
regex = "1.12"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
