[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seclogx"
version = "0.1.0"
description = "Fast, pandas-friendly threat hunting and analysis over Windows Event Log (.evtx) forensic acquisitions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "seclogx contributors" }]
dependencies = [
    "evtx>=0.9",
    "regipy>=6.0",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pysigma>=0.11",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "moto[s3]>=5.0", "fakeredis>=2.20", "redis>=5.0", "rq>=1.16"]
cluster = ["redis>=5.0", "rq>=1.16", "boto3>=1.34"]

[project.scripts]
seclogx = "seclogx.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
