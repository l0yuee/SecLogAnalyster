[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "seclogx-native"
version = "0.1.0"
description = "Optional native batch parsers for seclogx"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[tool.maturin]
python-source = "python"
module-name = "seclogx_native._native"
features = ["pyo3/extension-module"]
locked = true
